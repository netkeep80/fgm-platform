name: S04 current provenance and historical S02-S03

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  source-snapshots:
    name: Source snapshots / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check snapshot regression fixtures
        run: python -m unittest discover -s tests -p test_source_snapshots.py -v
      - name: Check real imported subtrees and Platform files
        run: python scripts/check-source-snapshots.py --head faff85c3683a7dd87026796bf33ad11ac6d22b33 --base 9a1b41b7050ee2342d247f8d43ce5e3977de2ee6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify historical S03 and current S04 Requirements
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test core/tests/document-language.test.mjs
          node core/scripts/check-document-language.mjs
          node --test tests/requirements-migration.test.mjs
          node scripts/check-requirements-migration.mjs 4c46d0f3aa2176a8d63448c01df55614ce169956
          node --test tests/core-integration.test.mjs
          node scripts/check-core-integration.mjs "${{ github.event.pull_request.head.sha }}"
      - name: Checkout immutable compiler for real migration mutations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          path: .rg-transition
          persist-credentials: false
      - name: Install compiler runtime dependencies
        working-directory: .rg-transition
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prove nested discovery and reject three invalid transitions
        run: node scripts/verify-requirements-transition.mjs
