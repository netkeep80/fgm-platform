name: Platform policy and historical evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-policy:
    name: Platform policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact current HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate current policy and successful no-op mutations
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/platform-policy.test.mjs
          node scripts/check-platform.mjs "${{ github.event.pull_request.head.sha || github.sha }}"
  historical-evidence:
    if: github.event_name == 'workflow_dispatch'
    name: Frozen historical evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout accepted immutable S04, including its original policy and tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5f5971eae131b2b5c79992203d2f27281d217a75
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Replay accepted S02, S03 and S04 integrity and negative suites
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m unittest discover -s tests -p test_source_snapshots.py -v
          python scripts/check-source-snapshots.py --head faff85c3683a7dd87026796bf33ad11ac6d22b33 --base 9a1b41b7050ee2342d247f8d43ce5e3977de2ee6
          node --test tests/requirements-migration.test.mjs tests/core-integration.test.mjs tests/ctest-gate.test.mjs
          node scripts/check-requirements-migration.mjs 4c46d0f3aa2176a8d63448c01df55614ce169956
          node scripts/check-core-integration.mjs 5f5971eae131b2b5c79992203d2f27281d217a75
      - name: Checkout immutable compiler for historical typed transition mutations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          path: .rg-transition
          persist-credentials: false
      - name: Replay real historical positive and three negative transitions
        run: |
          npm install --prefix .rg-transition --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/verify-requirements-transition.mjs
