name: DR3-R0-B isolated research runner
on:
  push:
    branches:
      - research/dr3-r0-b
permissions:
  contents: read
jobs:
  prepare:
    name: R0-B B2a prepare only
    if: github.repository == 'netkeep80/fgm-platform' && github.ref == 'refs/heads/research/dr3-r0-b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare exact F01 input corpus without comparisons
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/r0b-b2a"
          mkdir -p "$evidence"
          { git rev-parse HEAD HEAD^{tree}; python3 --version; node --version; } | tee "$evidence/environment.txt"
          python3 research/dr3-r0/r0-b/run.py b2-prepare --out "$evidence/inputs" | tee "$evidence/prepare.log"
          python3 research/dr3-r0/r0-b/run.py b2-prepare --out "$RUNNER_TEMP/r0b-b2a-repeat"
          diff -qr "$evidence/inputs" "$RUNNER_TEMP/r0b-b2a-repeat"
          (cd "$evidence"; sha256sum inputs/manifest.json environment.txt prepare.log | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r0b-b2a-f01-prepared
          path: ${{ runner.temp }}/r0b-b2a/
          if-no-files-found: error
          retention-days: 14
