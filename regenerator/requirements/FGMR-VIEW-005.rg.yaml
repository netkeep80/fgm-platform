normative: "### FGMR-VIEW-005 — Целостность и отказ при несовместимости. Просмотрщик должен проверять хеш канонических FGM-пакетов, соответствие идентичности исходного объекта, отчётов и представлений и не изменять семантические пакеты при смене вида или режима. При неподтверждённых и несовместимых входах он должен отказывать с диагностикой; диагностический OBJ не становится нормативным исполнителем FGM."
