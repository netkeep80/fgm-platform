normative: "### FGMV-CAM-001 — Детерминированная диметрическая камера. Для одной локальной плитки 16×16×24 рендерер должен воспроизводить дискретную ортографическую проекцию R05 с точным усечением к нулю, иметь четыре обратимых поворота на 90° без изменения семантики FGM и обеспечивать отдельное непрерывное обратное преобразование только на явно заданной плоскости высоты с отказом для недопустимых входов."
