format: repo-guard/requirement-v1
id: FGMV-PUB-001
normative: "### FGMV-PUB-001 — Воспроизводимая публикация принятого браузерного пакета. Публикация страницы камеры должна переносить в публичную ветку только файлы проверенного артефакта принятого V03-S3, с проверкой происхождения, точных SHA-256, списка файлов и неизменности исходной ветки, отклоняя повреждённые или чужие данные и не объявляя публикацию успешной до независимого подтверждения доступности GitHub Pages."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
  - predicates: [derives_from]
    target: {kind: requirement, id: "FGMV-PROJECT-000"}
  - predicates: [depends_on]
    target: {kind: requirement, id: "FGMV-CAM-003"}
  - predicates: [implemented_by]
    target: {kind: artifact, path: "scripts/promote_v03_s3.py"}
  - predicates: [verified_by]
    target: {kind: artifact, path: "tests/test_pages_release.py"}
  - predicates: [documents]
    target: {kind: artifact, path: "docs/pages-v03-s3.md"}
constraints:
  - id: fgmv_pub_001_execution_evidence
    activation: scoped_change
    scope:
      relations: [implemented_by, verified_by]
    evidence:
      class: execution
      key: "execution:tests/test_pages_release.py"
      verifier: {kind: artifact, path: "tests/test_pages_release.py"}
