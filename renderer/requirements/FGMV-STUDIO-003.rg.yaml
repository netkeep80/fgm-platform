format: repo-guard/requirement-v1
id: FGMV-STUDIO-003
normative: "### FGMV-STUDIO-003 — Выбор именованного элемента UFO. Studio должна принимать папку установки игры, получать каталог от нативного исполнителя и давать выбрать тактическую карту и именованный элемент. В реконструкции используются байты выбранной карты и её наборов, уже прочитанные для каталога элементов. Смена папки, карты или элемента должна сбрасывать устаревший результат. Неподдерживаемый профиль, отсутствие файлов и превышение размера запроса должны быть диагностированы локально. Ручная привязка доступна в расширенной диагностике."
