format: repo-guard/requirement-v1
id: FGMV-PUB-002
normative: "### FGMV-PUB-002 — Явное подтверждаемое развёртывание Pages. Публичная камера должна выпускаться через официальный GitHub Pages workflow лишь после точной проверки принятого снимка ветки, допустимых файлов и их содержимого, с разделением прав проверки и публикации. Статус завершённой публикации запрещён без успешного задания развёртывания и последующего подтверждения публичных HTTP-ресурсов."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
  - predicates: [derives_from]
    target: {kind: requirement, id: "FGMV-PROJECT-000"}
  - predicates: [depends_on]
    target: {kind: requirement, id: "FGMV-PUB-001"}
  - predicates: [depends_on]
    target: {kind: requirement, id: "FGMV-CAM-003"}
  - predicates: [implemented_by]
    target: {kind: artifact, path: ".github/workflows/studio-pages.yml"}
  - predicates: [implemented_by]
    target: {kind: artifact, path: "scripts/verify_pages_snapshot.py"}
  - predicates: [verified_by]
    target: {kind: artifact, path: "tests/test_pages_snapshot.py"}
  - predicates: [documents]
    target: {kind: artifact, path: "docs/pages-s2-deploy.md"}
constraints:
  - id: fgmv_pub_002_snapshot_execution
    activation: scoped_change
    scope:
      relations: [implemented_by, verified_by]
    evidence:
      class: execution
      key: "execution:tests/test_pages_snapshot.py"
      verifier: {kind: artifact, path: "tests/test_pages_snapshot.py"}
