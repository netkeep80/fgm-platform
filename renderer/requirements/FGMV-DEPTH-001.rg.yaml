format: repo-guard/requirement-v1
id: FGMV-DEPTH-001
normative: "### FGMV-DEPTH-001 — Независимая геометрическая аттестация глубины и отверстий. Рендерер должен подтверждать порядок перекрытия поверхностей, сквозные отверстия и сохранение видимости независимо от порядка перечисления граней при фиксированной камере на синтетических объектах посредством сравнения настоящего кадра WebGPU с аналитическим CPU-эталоном пересечения лучей и треугольников. Эталон не должен вызывать GPU-шейдер, менять C04/C05/LOFT или выдавать синтетическую геометрию за реконструкцию реальной игры. Отрицательные мутации глубины, заполнения отверстия и порядка перекрытий должны обнаруживаться автоматическими тестами."
