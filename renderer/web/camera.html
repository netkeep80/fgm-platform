<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FGM · Камера карты</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101722; color: #eff6fa; }
    body { margin: 0; }
    main { width: min(92vw, 40rem); margin: 2rem auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .65rem; }
    h1 { margin: 0; font-size: 1.65rem; font-weight: 620; }
    a { color: #90dfcf; }
    canvas { display: block; width: 100%; height: auto; margin: 1rem 0; background: #0f1622; border-radius: .4rem; }
    fieldset { display: flex; flex-wrap: wrap; gap: .5rem; border: 0; padding: 0; margin: 0; }
    button { border: 1px solid #41626e; border-radius: .35rem; background: #1c303a; color: inherit; padding: .5rem .7rem; font: inherit; }
    button:disabled { opacity: .55; }
    p { color: #a8c2ce; margin: .7rem 0; }
    #selection { font-variant-numeric: tabular-nums; color: #eff6fa; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Камера карты</h1>
      <a href="./">Демо сферы</a>
    </header>
    <canvas width="640" height="400" aria-label="Синтетическая карта FGM"></canvas>
    <fieldset aria-label="Управление камерой" disabled>
      <button id="turn-left">Повернуть влево</button>
      <button id="turn-right">Повернуть вправо</button>
      <button id="zoom-out">Уменьшить</button>
      <button id="zoom-in">Увеличить</button>
      <button id="reset-camera">Сбросить камеру</button>
    </fieldset>
    <p>Колесо мыши меняет масштаб под курсором. Щелчок выбирает клетку на высоте Z = 0.</p>
    <p id="selection" aria-live="polite">Клетка не выбрана</p>
    <p role="status" data-state="loading">Загружаем сцену…</p>
  </main>
  <script type="module" src="./camera.js"></script>
</body>
</html>
