format: repo-guard/requirement-v1
id: FGMP-PROJECT-000
normative: "### FGMP-PROJECT-000 — Проект должен обеспечивать независимый аудит exact BASE/HEAD/TREE, явное авторское принятие, воспроизводимое CI-свидетельство, причинную трассировку изменений, самостоятельный рабочий срез с актуальными требованиями и незавершёнными решениями и запрет публикации чужих игровых ресурсов в публичном репозитории. Полный архив истории прежних репозиториев не требуется; их удаление возможно отдельной финальной авторской операцией после FUNCTIONAL_PASS, INDEPENDENCE_PASS, REQUIREMENTS_PASS и SIMPLIFICATION_PASS."
lifecycle:
