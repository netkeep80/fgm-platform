format: repo-guard/requirement-v1
id: FGMP-BUILD-001
normative: "### FGMP-BUILD-001 — Platform должна собирать Core, единую CPU RVI реализацию, Regenerator и Renderer из корневого CMake-графа с локальными targets без внутренних Git FetchContent и без глобального отключения тестов. Одна RVI реализация обслуживает R07 и Raster oracle; целочисленная R05-проекция сохраняет отдельный предметный контракт. Native/Python R01–R07, CLI, package/hash, deterministic receipts, отрицательные проверки, Core/C05 и public consumer реально выполняются на Linux и Windows с точным enabled CTest inventory и --no-tests=error. Текущая защита закрепляет область изменений и критические verifiers независимо от проверяемого manifest, сохраняет ID, lifecycle и действующие execution contracts. Временная baseline policy развивается одним файлом и удаляется на S08 после действующей функциональной замены; исторические Git/Issues/PR/CI архивы и постоянный replay не требуются. Все ещё актуальные требования и незавершённые решения должны быть самостоятельно представлены в Platform. Упрощение оценивается по зависимостям, реализациям, владельцам, исключениям и процедурам сборки; обязательны независимый аудит и отдельная авторская приёмка. Private Stage A и browser R07 fit не входят в принятый native scope."
lifecycle: { accepted: false, current: false, published: false }
