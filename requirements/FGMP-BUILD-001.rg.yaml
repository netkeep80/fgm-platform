format: repo-guard/requirement-v1
id: FGMP-BUILD-001
normative: "### FGMP-BUILD-001 — Platform должна собирать Core, единую CPU RVI реализацию, Regenerator и Renderer из корневого CMake-графа с локальными targets без внутренних Git FetchContent и без глобального отключения тестов. Одна RVI реализация обслуживает R07 и Raster oracle; целочисленная R05-проекция сохраняет отдельный предметный контракт. Native/Python R01–R07, CLI, package/hash, deterministic receipts, отрицательные проверки, Core/C05 и public consumer реально выполняются на Linux и Windows с точным enabled CTest inventory и --no-tests=error. Пустая, неполная, отключённая или инвертированная suite отвергается. Действующие Requirements связывают реализацию и исполняемые предметные verifiers; RepoGuard J1/J2/J3 и независимый exact-HEAD аудит проверяют причинность изменений. Обычная разработка не требует исторических manifests, migration-checker, фиксированных снимков кода или старых репозиториев. Python сохраняется для необходимых задач. Private Stage A и browser R07 fit не выводятся из native scope."
lifecycle: { accepted: false, current: false, published: false }
