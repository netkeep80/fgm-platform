format: repo-guard/requirement-v1
id: FGMP-MIG-REQ-001
normative: "### FGMP-MIG-REQ-001 — Перенос требований S03 должен переместить все 73 требования закреплённых модулей в три ветви корневого каталога requirements без изменения ID, нормативного текста и связей между требованиями. Пути артефактов, проверяющих программ и ключи execution должны преобразовываться по явной таблице владения. Реестр переноса должен сохранять исходные Git-снимки, нормативные semantic digest, старые и новые субъекты, lifecycle и точные преобразования связей и ограничений. В новом репозитории все перенесённые субъекты должны оставаться кандидатами без автоматического принятия старых флагов. Исторический импорт S02 должен проверяться на принятом import HEAD, а 232 остальных файла модулей — сохранять исходные байты и режимы. Проверки должны отвергать изменение нормативного текста, ID, lifecycle, путей, ограничений, реестра и исходного кода; реальный закреплённый RepoGuard должен обнаруживать вложенные требования и отвергать удаление проверяющей связи, неверный путь и ресурс без владельца."
lifecycle:
  accepted: false
  current: false
  published: false
