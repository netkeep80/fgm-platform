format: repo-guard/requirement-v1
id: FGMP-MIG-CORE-001
normative: "### FGMP-MIG-CORE-001 — Интеграция Core S04 должна собирать существующий локальный fgm::cpu из корня Platform, сохранять публичный C++ API и семантические исходники без изменений и предоставлять независимое управление внутренними тестами Core без выключения CTest потребителя. На Linux и Windows должны реально выполняться все прежние Core Node suites, исходный нативный тест, отдельный потребитель публичного API и сравнение native/reference C05 на 6144 центрах с проверкой материалов, вкладов, повторов, порядка запросов и отказов. Исторические S02/S03 должны оставаться воспроизводимыми на принятых коммитах. Текущая проверка S04 должна разрешать только явно заданное изменение Core CMake и связей на активный CI, сохранять 73 нормативных значения, ID, lifecycle и constraints и отвергать незаявленные изменения кода, проверяющих связей, флагов, исторического checker и пропуск предметного CI. Содержимое критических verifier, корневого CMake, исторических CI-компонентов и тестовых harness должно совпадать с закреплёнными mode/blob/SHA-256; ожидания не должны извлекаться из проверяемого HEAD или редактируемого manifest. Замены на успешные no-op, включая одновременную подмену записи manifest, должны отвергаться. Перед CTest должен проверяться точный, уникальный и включённый состав трёх корневых тестов и одного теста consumer; CTest должен выполняться с --no-tests=error. Пустая и неполная suite должны приводить к отказу. Срез не должен выдавать структурный результат RepoGuard за исполнение предметных проверок."
