format: repo-guard/requirement-v1
id: FGMP-WASM-001
normative: "### FGMP-WASM-001 — Platform должна собирать Regenerator Worker и Renderer scene/camera через одну root Emscripten config из того же текущего checkout, что native consumers. Пакет Studio должен связывать SHA/TREE Platform, protocol/whole-build/core semantic contracts и SHA-256 разрешённых активов; другая ревизия, TREE, изменённый источник, некорректный WASM или состав пакета отвергаются. Старые Core/Regenerator/Renderer repos не используются при сборке и исполнении; проверка блокирует доступ к ним. Реальные Native/Node Worker/Chromium suites сохраняют protocol/cell/catalog/whole package/C05 parity, Renderer WASM/native frame parity, восстановление/отказ GPU, независимый depth/occlusion/holes oracle, ограниченный readback, cancellation/epoch и отрицательные контракты. Browser tests используют только локальные синтетические активы и отвергают внешние запросы. Одна root CI непосредственно исполняет эти проверки без вложенных workflow, forwarding aliases и исторического replay. Python и текущие native Linux/Windows tests сохраняются. Исторический архив не требуется; до финального удаления старых repos актуальные незавершённые требования и решения должны самостоятельно существовать в Platform. Этот же проверенный пакет используется автоматической Pages публикацией. Private Stage A, browser R07 fit и визуальная авторская приёмка остаются отдельными продуктовыми задачами; lifecycle не повышается автоматически."
lifecycle: { accepted: false, current: false, published: false }
