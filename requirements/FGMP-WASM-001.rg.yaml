format: repo-guard/requirement-v1
id: FGMP-WASM-001
normative: "### FGMP-WASM-001 — Platform должна собирать Regenerator Worker и Renderer scene/camera через одну root Emscripten config из того же текущего checkout, что native consumers. Пакет Studio должен связывать SHA/TREE Platform, protocol/whole-build/core semantic contracts и SHA-256 разрешённых активов; другая ревизия, TREE, изменённый источник, некорректный WASM или состав пакета отвергаются. Старые Core/Regenerator/Renderer repos не используются при сборке и исполнении; проверка блокирует доступ к ним. Реальные Native/Node Worker/Chromium suites сохраняют protocol/cell/catalog/whole package/C05 parity, Renderer WASM/native frame parity, восстановление/отказ GPU, независимый depth/occlusion/holes oracle, ограниченный readback, cancellation/epoch и отрицательные контракты. Browser tests используют только локальные синтетические активы и отвергают внешние запросы. Полезные проверки legacy workflow переносятся в текущую root CI до удаления копий; forwarding aliases и исторический replay не становятся постоянной зависимостью. Python и текущие native Linux/Windows tests сохраняются. Исторический архив не требуется; до финального удаления старых repos актуальные незавершённые требования и решения должны самостоятельно существовать в Platform. Пакет этого среза предназначен для локального тестирования и ревью; production Pages, работающий rollback, визуальная приёмка S07, Stage A и browser R07 fit принимаются отдельно. Все новые нормативные субъекты сохраняют false/false/false до отдельного lifecycle решения."
lifecycle: { accepted: false, current: false, published: false }
