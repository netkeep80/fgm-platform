format: repo-guard/requirement-v1
id: FGMR-R07-WHOLE-SURFACE-001
normative: "### FGMR-R07-WHOLE-SURFACE-001 — Наблюдение непрерывной поверхности единой многоклеточной FGM-модели. Регенератор должен принимать один канонический FGM-пакет с SHA-256 и от двух до восьми удостоверяемых клеточных привязок, каждая из которых содержит координаты карты и экземпляра, полную эталонную R03/LOFT таблицу из 384 16-битных строк и параметры принятой камеры R05. Прежде любого пиксельного результата он обязан посредством принятого fgm::Evaluator и единого глобального локального базиса проверить занятость всех 6144 центров каждой заявленной клетки и материал, а любой C05 mismatch обозначать отдельным точно типизированным отказом без частичной проекции. Только после общего C05 gate допускается вычислять по каждой части конечную непрерывную проекцию R05, применяя одобренные tile/sprite anchors, переводя лучи из клеточного базиса в единый FGM базис и сохраняя идентичность исходной камеры, детерминированность, бюджеты и подписи наблюдений. Результат не может выдавать отдельные TilePart изображения за глобальные независимые виды или компенсировать отсутствие полноценной глубины, source provenance, оригинального игрового запуска, whole-object joint fit и четырех новых 3D-ракурсов. Настоящие игровые байты и производные изображения/модели должны оставаться локальными/приватными; публичные CI fixtures только синтетические."
