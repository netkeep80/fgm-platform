format: repo-guard/requirement-v1
id: FGMR-R07-FITTED-SURFACE-001
normative: "### FGMR-R07-FITTED-SURFACE-001 — Поверхность результата native R07. Существующие синтетический и локальный source-bound fit должны атомарно экспортировать версионированный fit-preview.json с точными baseline/membership/winner SHA, исходными наблюдениями и receipt. Native и WASM Studio должны заново собирать baseline из тех же B1/R03 входов, проверять SHA, состав клеток, строки C05 и допустимое общее преобразование действующей R07 box-union грамматики. Все C05-центры каждой клетки должны совпадать до выдачи поверхности. Метрики исходных силуэтов до и после должны пересчитываться одним существующим C++ R07 observer с запретом регресса отдельного наблюдения. Производная OBJ-поверхность должна соответствовать непрерывным дробным границам именно импортированной модели, исключать внутренние и дублирующие грани объединения, иметь ограничение ресурсов и явный отказ для неподдерживаемой грамматики. Studio должна показывать четыре глобальных вида этого пакета/поверхности через существующий RendererSession и исходные силуэты/до/после, сохранять локальные результаты с общей идентичностью. Изменение входов и отмена исключают устаревшие результаты. Занятость и импортированные наблюдения отделяются от предполагаемой непрерывной/скрытой геометрии; provenance и принадлежность исходному объекту остаются условными. Stage A NOT_ACCEPTED и PRIVATE_ACCEPTANCE_PENDING сохраняются. Это импорт и повторная проверка native fit, не итеративный browser R07. Исполняемые native/Windows/WASM/Chromium тесты должны проверять дробную геометрию независимым аналитическим oracle, перекрытия, отверстия, границы, неверные SHA/состав/C05/данные/камеры и отмену."
