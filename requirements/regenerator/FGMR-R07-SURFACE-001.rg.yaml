format: repo-guard/requirement-v1
id: FGMR-R07-SURFACE-001
normative: "### FGMR-R07-SURFACE-001 — Непрерывное наблюдение поверхности при неизменной игровой занятости. Регенератор должен предоставлять отдельный ограниченный нативный исполнитель, который по проверенному хэшу канонического пакета FGM строит новую воспроизводимую бинарную проекцию непрерывной поверхности на калиброванную аффинную камеру R05, используя принятый вычислитель FGM, а не дискретную проекцию LOFT. До вычисления изображения исполнитель должен требовать точного совпадения всех 6144 центровых проб занятости и материала с переданной эталонной таблицей; успешная проверка этой таблицы не должна выдаваться за доказательство происхождения оригинальных игровых файлов либо полноты непрерывных коллизий. Исполнитель обязан сохранить неизменными существующие R05 и C05, выпускать отдельное версионированное свидетельство с параметрами камеры, SHA-256 и явной неопределённостью относительно тонких поверхностей. При неверных входных данных, хэшах, ограничениях или C05 исполнитель должен отказывать без успешного свидетельства. Независимый синтетический тест обязан удостоверить, что две модели с одинаковой LOFT-занятостью дают равную проекцию LOFT, но различную проекцию поверхности, и распознавать подмену последней неизменной LOFT-маской. Реальные игровые файлы и полученные из них изображения запрещено публиковать в публичных CI, репозиториях и Pages."
