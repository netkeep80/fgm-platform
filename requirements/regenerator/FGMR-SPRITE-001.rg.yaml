format: repo-guard/requirement-v1
id: FGMR-SPRITE-001
normative: "### FGMR-SPRITE-001 — Исходные спрайтовые факты. Регенератор должен декодировать плотно упакованные кадры PCK местности на холсте 32×40 по явно заданному 16- или 32-битному формату TAB с байтовыми смещениями. Он должен сохранять индексы и альфу каждого пикселя, восемь исходных ссылок выбранной записи MCD в их порядке и значения RGB6 выбранного банка вместе с их представлением RGB8. Прозрачный пробег PCK должен обрезаться по краю холста с сохранением проверки терминатора и границы кадра. Некорректные смещения, начальный пропуск или литерал за холстом, усечённое кодирование, неверные ссылки и палитры должны приводить к диагностируемому отказу. Корректность должна проверяться независимым оракулом на самостоятельно созданных файлах."
