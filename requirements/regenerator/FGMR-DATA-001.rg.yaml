format: repo-guard/requirement-v1
id: FGMR-DATA-001
normative: "### FGMR-DATA-001 — Свободный корпус R01. Регенератор должен создавать не менее трёх собственных воспроизводимых синтетических классов геометрии с объёмной маской, диагностической ортографической проекцией, палитрой и структурными метаданными. Происхождение каждого класса и размер с контрольной суммой каждого файла должны присутствовать в каноническом манифесте. Публичный экспорт корпуса должен отклонять дополнительные и изменённые файлы, подмену прав и происхождения, символические ссылки, NTFS junction/reparse points и неканонический состав файлов и каталогов, включая пустые каталоги посредством независимого повторного построения. Генерация не должна обращаться к оригинальным игровым ресурсам и не должна перезаписывать существующий каталог."
