format: repo-guard/requirement-v1
id: FGMR-UFO-CATALOG-001
normative: "### FGMR-UFO-CATALOG-001 — Локальный каталог тактических элементов UFO. Исполнитель должен принимать список путей выбранной папки, выделять тактические карты и связывать штатные блоки с проверенным порядком наборов и соответствующими графическими ресурсами. Для выбранного блока он должен перечислять именованные типы элементов, стабильные исходные идентификаторы и привязки для запуска реконструкции. Неопознанные блоки, недостающие файлы и несколько корней должны быть явно диагностированы. Каталог не должен читать файлы по переданным путям или передавать исходные данные по сети."
