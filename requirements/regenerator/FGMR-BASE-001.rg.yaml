format: repo-guard/requirement-v1
id: FGMR-BASE-001
normative: "### FGMR-BASE-001 — Воспроизводимая базовая реконструкция. Регенератор должен из маски статической части клетки выпускать канонический FGM-пакет с заданным семантическим материалом и воспроизводимым семенем, проверять занятость всех центров вокселей принятым интерпретатором, измерять расхождения со спрайтом в исходной проекции и сохранять происхождение входов и неопределённость скрытых поверхностей. Трёхмерная сетка должна отображать границы проверенной занятости. Тесты должны использовать три самостоятельно созданных класса и проверять повторяемость байтов."
