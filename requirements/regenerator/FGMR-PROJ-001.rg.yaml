format: repo-guard/requirement-v1
id: FGMR-PROJ-001
normative: "### FGMR-PROJ-001 — Диагностическая диметрическая проекция местности. Регенератор должен воспроизводить экранные якоря клеток и вокселей для исходного холста 32×40, учитывая порядок округления и смещение камеры. Сравнение должно сохранять исходный якорь спрайта с поправкой P_Level, прозрачность нулевого индекса и координаты правой половины при выбранном режиме отсечения. В исходных пикселях он должен строить маску проекций занятых вокселей и вычислять число общих и несовпадающих пикселей со спрайтом. Якоря и маски проверяются на самостоятельно созданных сценах, отдельно от художественной реконструкции."
