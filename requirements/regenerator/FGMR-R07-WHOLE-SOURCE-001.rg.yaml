format: repo-guard/requirement-v1
id: FGMR-R07-WHOLE-SOURCE-001
normative: "### FGMR-R07-WHOLE-SOURCE-001 — Предварительное удостоверение полноты связей исходных частей. Перед объявлением результатов R07 восстановлением целой ObjectDefinition регенератор должен отдельно проверить заранее полученное независимым источниковым свидетельством членство экземпляра в версии R06-S2B1. Он обязан сверять точный SHA-256 исходного B1 receipt, SHA-256 и порядок MAP/MCD исходных файлов с источниковым снимком R07-S0, а также однозначное присутствие выбранного R04/R05 наблюдения среди членов экземпляра. Для каждой заявленной части он должен вызывать единственный принятый native R03 и удостоверять координату, запись MAP, TilePart, набор/локальный индекс MCD, LOFT-идентификаторы и корректность всех 384 строк. Выбранная часть должна повторно пройти принятый native Studio R04/R05/R06/C05. Неполная/противоречивая принадлежность, неверный SHA, порядок исходных наборов, сбой native или неподтверждённая строка должны вызывать fail-closed отказ без успешного receipt. Доверенные исполняемые файлы должны вызываться из проверенных по внешнему SHA-256 приватных копий. Внешняя истинность удостоверившего принадлежность лица не доказывается этой процедурой; результат предварительной проверки не является общим параметрическим fit, полным C05 для изменённого целого объекта, четырьмя новыми ракурсами или Stage A acceptance. Исходные и производные игровые байты, модели и личные пути допускаются только offline/private; публичная CI использует собственную синтетику."
