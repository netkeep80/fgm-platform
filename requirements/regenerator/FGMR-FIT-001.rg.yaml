format: repo-guard/requirement-v1
id: FGMR-FIT-001
normative: "### FGMR-FIT-001 — Базовый подбор параметров проёма. Регенератор должен воспроизводимо подобрать допустимые параметры фиксированной синтетической панели по одной фронтальной маске в явном бюджете. Он должен проверять защищённые пробы до оценки кандидата, сохранять измерения до и после подбора, отклонённые попытки, число рендеров и время. Выходная программа должна сохранить число узлов и совпасть с независимой проверкой материала и занятости. Четыре контрольных ракурса проверяются после подбора, а вывод о невидимых поверхностях отмечается как гипотеза."
