format: repo-guard/requirement-v1
id: FGMR-R07-FIT-LOCAL-001
normative: "### FGMR-R07-FIT-LOCAL-001 — Локальный ограниченный подбор параметров FGM по исходному спрайту. Регенератор должен по проверенному SHA-256 снимку локальных MAP/MCD/PCK/TAB/LOFT/палитры и однозначно заданной MAP-клетке получать исходное наблюдение исключительно через принятые native R04/R05/R06/C05, а эталонные центровые LOFT rows — отдельно через принятый native R03, проверяя совпадение source-binding, LOFT ID и исходных доказательств. Для ограниченного воспроизводимого набора кандидатов существующей FGM grammar он обязан сохранять неизменность всех 6144 C05 центров и материала как жёсткое условие допуска; только после этого измерять IoU и расстояние контура для отдельной непрерывной R07-S1A-проекции по исходному R04-спрайту. Результат должен содержать baseline/best, детерминированный trace, SHA-256 исходников/инструментов/матмоделей и явный статус улучшения либо отсутствия улучшения. Одиночная MCD запись, признак membership.status или улучшение одного кадра не могут утверждаться независимым доказательством целой ObjectDefinition, четырёх новых видов или завершённого Stage A. Любой ложный источник, нарушение C05, некорректный исполнитель или превышение лимита должны приводить к отказу без успешного свидетельства. Реальные оригинальные и производные игровые файлы, изображения, модели, локальные пути сохраняются только offline/private; публичные тесты используют собственные синтетические данные."
