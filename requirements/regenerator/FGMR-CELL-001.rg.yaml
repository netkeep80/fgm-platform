format: repo-guard/requirement-v1
id: FGMR-CELL-001
normative: "### FGMR-CELL-001 — Сквозное восстановление клетки в Studio. Регенератор должен восстановить выбранную статическую часть из локальных ресурсов с явным порядком MCD, проверить пакет через C05 и получить побайтово сопоставимые модель, сетку, отчёт и свидетельство в native и WASM Worker. Неполные привязки, повреждённые ресурсы и превышение лимита должны давать определённую ошибку."
