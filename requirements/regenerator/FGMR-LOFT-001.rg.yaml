format: repo-guard/requirement-v1
id: FGMR-LOFT-001
normative: "### FGMR-LOFT-001 — Восстановление статических LOFT-вокселей. Регенератор должен декодировать собственные последовательности профилей LOFTEMPS из шестнадцати little-endian строк по 16 бит, точно разрешать двенадцать LOFT-идентификаторов MCD по двум уровням высоты на слой, сохранять обратную битовую адресацию X, прямую адресацию Y и координаты клетки 16×16×24. Он должен сохранять маску каждой из четырёх исходных частей, их побитовое объединение, приоритет первого попадания и идентичность профиля и источника для каждого попадания. Отсутствующие профили, некорректные размеры и внешние координаты не должны приводить к неопределённому чтению или скрытому исправлению. Отдельный независимый вычислительный эталон должен проверить биты и маски на собственных синтетических данных. Динамическая семантика дверей, юнитов, гравилифтов и художественная интерпретация геометрии не входят в данный срез."
