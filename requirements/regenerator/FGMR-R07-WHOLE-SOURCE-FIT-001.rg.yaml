format: repo-guard/requirement-v1
id: FGMR-R07-WHOLE-SOURCE-FIT-001
normative: "### FGMR-R07-WHOLE-SOURCE-FIT-001 — Локальный совместный подбор по исходным ресурсам. Регенератор должен повторно получать R03-строки всех частей одного проверенного экземпляра B1 из входного снимка MAP/MCD/LOFT, сверять исходный receipt S1B1A с результатом повтора и получать не менее двух непустых наблюдений разных клеток через нативный Studio R04/R05. Один нативный сборщик R06 должен формировать исходный FGM-пакет из тех же R03-данных. Совместный подбор должен проверять C05 всех заявленных клеток и применять общую метрику ко всем наблюдениям с запретом индивидуального регресса. В режиме поиска по осям каждая ограниченная поправка полуразмеров или перенос должны применяться общим вектором ко всей модели, а отчёт должен фиксировать тип и параметры каждого варианта. Отчёт должен фиксировать контрольные суммы исходных свидетельств, кандидатов и моделей, явный результат поиска и Stage A NOT_ACCEPTED. Оригинальные ресурсы и производные результаты предназначены для локального использования. Комплект выходных файлов должен публиковаться атомарно под новым именем каталога с запретом замены уже существующего имени."
