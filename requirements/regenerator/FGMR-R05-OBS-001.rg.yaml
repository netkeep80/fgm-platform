normative: "### FGMR-R05-OBS-001 — Пиксельные наблюдения R05 для Studio. Регенератор должен предоставлять для выбранной части клетки оригинальные индексы кадра R04, палитру, калиброванные координатные маски R05 исходного изображения и проверенной C05 реконструкции, сохранять исходную привязку и правую половину кадра, выдавать воспроизводимое версионированное представление и его SHA-256 в свидетельстве, не изменяя канонические FGM и R06-данные."
