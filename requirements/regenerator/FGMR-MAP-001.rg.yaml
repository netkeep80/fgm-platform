format: repo-guard/requirement-v1
id: FGMR-MAP-001
normative: "### FGMR-MAP-001 — Декодирование MAP/MCD в нормализованные исходные факты. Регенератор должен без художественных предположений преобразовывать корректные бинарные MAP и упорядоченные MCD-наборы в воспроизводимые исходные факты, точно сохраняя размеры и порядок MAP, координаты ячеек, четыре исходных индекса частей, идентичность набора и локального MCD-элемента, порядок Frame и LOFT, структурно подтверждённые свойства MCD и все 62 исходных байта каждой записи. Неоднозначные имена, недопустимые размеры, выравнивания, отсутствующие наборы, неразрешимые ссылки частей, локальные Die_MCD/Alt_MCD вне набора и нулевая броня должны обнаруживаться без скрытого исправления. Исходные и нормализованные байты должны восстанавливаться побайтово на собственных синтетических фикстурах, а исходные игровые файлы не должны попадать в публичные репозитории и CI."
