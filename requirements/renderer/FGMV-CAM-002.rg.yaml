format: repo-guard/requirement-v1
id: FGMV-CAM-002
normative: "### FGMV-CAM-002 — Диметрическая камера карты. Рендерер должен проецировать непрерывные координаты прямоугольной карты, поддерживать четыре поворота вокруг её центра, масштаб и область просмотра, выбирать клетку на явно заданной плоскости по полуоткрытому правилу и сохранять мировую точку под курсором при смене масштаба и поворота. Обратный запрос по результату проекции должен сохранять сторону границы, если её отличает точность этого результата. Нулевая ориентация должна совпадать с непрерывной проекцией локальной плитки R05 при тех же условиях."
