format: repo-guard/requirement-v1
id: FGMV-SESSION-001
normative: "### FGMV-SESSION-001 — Единый контракт RendererSession. Библиотека визуализации должна отделять неизменяемую идентичность и сериализованные байты FGM-пакета от экземпляров сцены, пространственного размещения, производной геометрии, камеры, профиля отображения и состояния кадра. Изменение вида, визуального профиля и детальности не должно менять авторитетные C04/C05/LOFT или игровые решения. API будущего общего backend для Studio и игры должен явно объявлять возможности, версии источника и вида, жизненный цикл, отмену, запрет устаревшего кадра и диагностический fallback; недоступные возможности должны приводить к явному отказу. Контракт не свидетельствует о существовании реализации backend."
