format: repo-guard/requirement-v1
id: FGMV-SESSION-005
normative: "### FGMV-SESSION-005 — Ограничение чтения кадров WebGPU. Сессия должна удерживать ресурсы не более одного выполняемого кадра WebGPU и одного ожидающего запроса. Новый запрос вытесняет предыдущий ожидающий. Отмена, инвалидация сцены или вида и завершение сессии должны освобождать ожидающий запрос без выделения ресурсов кадра. Устаревший результат не публикуется. Проверка Chromium должна выполнить реконструкцию восьми клеток через закреплённый WASM и отрисовку 3840×2160, подтвердить порядок публикации и верхнюю границу числа одновременных операций чтения."
