format: repo-guard/requirement-v1
id: FGMV-STUDIO-002
normative: "### FGMV-STUDIO-002 — Пиксельное сравнение реконструкции одной клетки. Приложение должно показывать исходный кадр R04, реконструированный силуэт, наложение, разницу и проекцию LOFT-занятости в общей системе координат, полученной из нативного R05. Перед показом оно должно проверять схему локального наблюдения, совпадение SHA-256 и статистики с результатом запуска. При отсутствии или повреждении наблюдения приложение должно очищать результат и сообщать код ошибки. Пиксели локального наблюдения не должны автоматически передаваться по сети."
