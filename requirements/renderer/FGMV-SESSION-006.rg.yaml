format: repo-guard/requirement-v1
id: FGMV-SESSION-006
normative: "### FGMV-SESSION-006 — Обработка отказов кадра WebGPU. Актуальный запрос должен получать failed при отказе подготовки кадра или чтения пикселей с указанием причины. Ошибка кадра очищает холст, освобождает выделенные ресурсы и допускает повторный запрос на живом устройстве. Статус device-lost должен соответствовать подтверждённой потере GPUDevice. Подтверждённая потеря очищает холст и блокирует дальнейшую отрисовку на этом устройстве. Устаревший или отменённый запрос не публикует результат."
