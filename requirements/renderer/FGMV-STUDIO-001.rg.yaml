format: repo-guard/requirement-v1
id: FGMV-STUDIO-001
normative: "### FGMV-STUDIO-001 — Предварительная интерактивная реконструкция одной клетки. Приложение должно принимать локально выбранные файлы MAP, упорядоченные MCD, LOFTEMPS, PCK/TAB и палитру, требовать явной привязки исходных наборов и запускать принятый алгоритм R06 в отдельном WASM Worker без дублирования семантики C05 в JavaScript. Оно должно валидировать и показывать FGM, OBJ и отчёт, разрешать экспорт на локальный диск, отказывать при ошибках привязки и не отправлять оригинальные данные в сеть. Этот предварительный срез не объявляет реализованными исходную R05-калибровку изображений, пиксельное сравнение Original/Overlay/Difference и полную публикацию Studio."
