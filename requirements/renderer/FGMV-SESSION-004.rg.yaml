format: repo-guard/requirement-v1
id: FGMV-SESSION-004
normative: "### FGMV-SESSION-004 — Вывод проверенной геометрии через WebGPU. Сессия должна при запросе WebGPU создать настоящий графический backend и отображать проверенную производную геометрию целого объекта с буфером глубины, орбитальной камерой и разметкой выбранной клетки. При недоступности WebGPU диагностический Canvas2D разрешён только явной политикой вызова. Проверка SHA-256, привязок и ревизий выполняется в общем пути RendererSession. При ошибке загрузки устаревший кадр должен быть очищен. Отображение не изменяет канонические FGM, C04, C05 или LOFT. Chromium должен проверять видимый вывод WebGPU на артефактах WASM для объектов 2×1 и 2×2."
