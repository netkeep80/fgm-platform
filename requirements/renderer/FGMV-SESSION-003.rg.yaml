format: repo-guard/requirement-v1
id: FGMV-SESSION-003
normative: "### FGMV-SESSION-003 — Сквозная передача целого объекта в диагностическую сессию. Система визуализации должна принимать фактические сериализованные артефакты целого объекта, полученные утверждённым C++20/WASM BuildWholeObject, с подтверждением SHA-256 точных байтов модели и производной OBJ-геометрии до отображения через RendererSession. Должны проверяться целые синтетические объекты 2×1 и 2×2 без независимой повторной реконструкции клеток. При ошибке загрузки, недопустимом виде и уничтожении сессии ранее отображённый кадр должен быть очищен. Идентичности mesh, сцены с клеточными привязками и экземпляром, и представления с камерой должны различаться. Этот срез не должен менять авторитетные C04/C05/LOFT, подменять подтверждение происхождения B1/R03, заявлять рабочий WebGPU или автоматически переключать опубликованную Studio."
