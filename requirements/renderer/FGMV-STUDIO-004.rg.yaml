format: repo-guard/requirement-v1
id: FGMV-STUDIO-004
normative: "### FGMV-STUDIO-004 — Оригинальные спрайты в раскрытом списке элементов. После выбора локальной папки игры и тактической карты Studio должна показывать рядом с названием каждого доступного элемента оригинальную миниатюру PCK/TAB 32×40 ещё до выбора элемента и реконструкции, включая корректную палитру, прозрачность и правую половину кадра. В закрытом элементе управления должны отображаться миниатюра и имя выбранной записи. Декодирование выполняет существующий нативный R04 через ограниченный пакетный WASM-протокол для локальных ресурсов текущей карты, без повторной реализации PCK/TAB на JavaScript и без сетевой отправки. Элемент выбора должен поддерживать доступное управление клавиатурой, touch/указатель, явно диагностировать повреждённые спрайты, ограничивать число одновременно декодируемых кадров, память и DOM, отбрасывать устаревшие результаты при смене исходных данных."
