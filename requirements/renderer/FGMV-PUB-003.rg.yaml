format: repo-guard/requirement-v1
id: FGMV-PUB-003
normative: "### FGMV-PUB-003 — Выпуск Reconstruction Studio с каталогом UFO и проверяемый откат. При каждом обновлении main workflow должен пересобирать Studio и WASM из одного точного коммита Platform, без загрузки старых FGM-репозиториев. Допуск к автоматической и ручной публикации Studio должен требовать успешного RepoGuard на точном коммите сборки, проверки схемы манифеста, состава файлов, ревизий и контрольных сумм. Перед публикацией workflow должен сверять коммит сборки Studio с актуальным main. После успешных проверок актуальная сборка должна публиковаться автоматически по событию обновления main. Версия в шапке Studio и публичном манифесте должна иметь формат A.M. Положительный номер архитектуры A хранится в репозитории и увеличивается на единицу при несовместимом изменении архитектуры Studio. Номер M равен числу merge-коммитов в истории main по первым родителям до коммита сборки включительно. M не обнуляется при повышении A. Полный SHA и TREE опубликованного коммита Platform должен присутствовать в подсказке версии и публичном манифесте. Приёмка выпуска должна подтверждать по HTTP версию и контрольные суммы опубликованных файлов и сохранять свидетельство успешной реконструкции синтетического именованного элемента через выбор локальной папки в Chromium с WASM. Ручной откат должен использовать необходимые проверенные Platform release artifacts и подтверждать публичные байты без доступности старых репозиториев или старого Pages. Проверки PR и подготовка сайта должны выполняться без разрешений публикации. Публичный пакет должен содержать только проверенные материалы с синтетическим примером."
