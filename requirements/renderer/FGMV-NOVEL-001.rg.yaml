format: repo-guard/requirement-v1
id: FGMV-NOVEL-001
normative: "### FGMV-NOVEL-001 — Четыре глобальных вида целого объекта. После успешной сборки 2–8 клеток через существующий WASM BuildWholeObject и проверки C05 всех клеток Studio должна показывать четыре новые глобальные камеры одной неизменной FGM-модели и одной производной поверхности через RendererSession WebGPU с буфером глубины. Камеры имеют общий базис fgm-voxel, фиксированные различные азимуты с шагом четверть оборота и одинаковую высоту обзора; это не исходные спрайты частей. Локальный результат версии 1 должен связывать membership SHA, instance/prototype, состав клеток, package/mesh SHA, камеры и контрольные суммы кадров. Принадлежность остаётся условной гипотезой B1, наблюдённая занятость отличается от предполагаемой непрерывной поверхности и неизвестных скрытых деталей. Stage A не принимается автоматически. При недоступном WebGPU допускается явно обозначенный диагностический preview без подтверждённых четырёх видов. Отмена или изменение входов удаляют все прежние виды и запрещают публикацию устаревших результатов. Исполняемая проверка должна сравнивать четыре реальных WASM/WebGPU вида асимметричного синтетического объекта с независимым CPU ray/box oracle, обнаруживать неверную камеру, заполненное отверстие, ошибочную принадлежность и позднее завершение отменённого GPU readback."
