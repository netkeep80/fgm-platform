format: repo-guard/requirement-v1
id: FGMV-PUB-002
normative: "### FGMV-PUB-002 — Явное подтверждаемое развёртывание Studio Platform должно выполняться единственным официальным GitHub Pages workflow после проверки точного принятого main SHA/TREE, допустимых файлов и их содержимого, с разделением прав проверки PR и публикации. Статус завершённой публикации запрещён без успешного задания deploy и последующей проверки публичных HTTP hashes, версии и реального WASM/Chromium smoke. Старые репозитории и их Pages не требуются для подготовки, проверки и публикации."
