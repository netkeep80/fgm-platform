format: repo-guard/requirement-v1
id: FGMV-PUB-001
normative: "### FGMV-PUB-001 — Воспроизводимая публикация принятого браузерного пакета Platform должна использовать только проверенный неизменяемый CI artifact с точными repository/workflow/run/attempt/source SHA/TREE, полным hash index и разрешённым составом файлов. Повреждённые, чужие и неполные пакеты отвергаются до изменения публичного сайта. Продукт повторно не пересобирается на границе публикации; исходная ветка не изменяется. Успех публикации подтверждается фактическим deploy и независимой проверкой публичных HTTP-ресурсов."
