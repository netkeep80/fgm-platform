format: repo-guard/requirement-v1
id: FGMV-CAM-003
normative: "### FGMV-CAM-003 — Камера карты в браузере. Браузерная демонстрация должна выводить синтетическую прямоугольную карту через WebGPU по проекции математической камеры, собранной в WASM, давать четыре поворота, сохранять мировую точку под курсором при масштабе и показывать клетку на явно заданной плоскости. Полный оборот должен восстанавливать исходный кадр при неизменных параметрах камеры."
