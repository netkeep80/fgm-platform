normative: "### FGMV-RVI-001 — Эквивалентность трёх способов вывода. Для неизменяемого снимка непрозрачной синтетической FGM-материи и одного ортографического запроса рендерер должен получать согласованные маску видимости, линейную глубину и семантическую идентичность видимых попаданий при прямом выводе, композиции восьми кубов и двухуровневой композиции шестьдесят четыре — восемь — один."
