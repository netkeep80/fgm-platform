normative: "### FGMV-USER-001 — Пользовательская задача выбора и реконструкции элемента UFO. Пользователь, имеющий локальную папку с ресурсами UFO, должен иметь возможность без ручного знания форматов исходных файлов выбрать тактическую карту и именованный элемент, выполнить локальную реконструкцию одной его статической части и получить проверяемые визуальный результат, метрики и экспорт без сетевой отправки исходных игровых данных."
