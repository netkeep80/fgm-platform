format: repo-guard/requirement-v1
id: FGMP-MIG-HISTORY-001
normative: "### FGMP-MIG-HISTORY-001 — До переноса исходного кода инструмент проверки миграции должен в изолированном Git-репозитории воспроизводимо объединять закреплённые истории Core, Regenerator и Renderer под отдельными префиксами, сохраняя идентичность исходных коммитов, их родителей, содержимое и режимы файлов; неправильные снимки, неполная shallow-история, коллизии префиксов и изменение файлов вне префикса должны обнаруживаться."
lifecycle:
  accepted: false
  current: false
  published: false
